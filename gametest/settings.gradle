pluginManagement {
    repositories {
        maven {
            name = 'Quilt'
            url = 'https://maven.quiltmc.org/repository/release'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }

    includeBuild('../')
}

dependencyResolutionManagement {
    versionCatalogs {
        rootLibs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}
