plugins {
    id 'java'
    id 'gametestable'
    alias libs.plugins.fabric.loom
}

loom {
    runs {
        gametest {
            name 'Game Test'
            source sourceSets.main

            server()

            ideConfigGenerated(true)

            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest.xml').get().getAsFile()}"
        }
    }
}

repositories {
    maven {
        name = 'gametest'
        url = '../build/gametestable'
    }
}

dependencies {
    minecraft(rootLibs.minecraft)
    mappings "org.quiltmc:quilt-mappings:${gametestable.version}:intermediary-v2"

    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
}

processResources {
    final expanding = [
        version: gametestable.version,
        group: 'org.quilt.internal',
        minecraft_version: rootLibs.versions.minecraft.get(),
        fabric_loader_version: libs.versions.fabric.loader.get(),
        fabric_api_version: libs.versions.fabric.api.get()
    ]

    inputs.properties(expanding)

    filesMatching('fabric.mod.json') {
        expand expanding
    }
}