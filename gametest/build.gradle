plugins {
    id 'java'
    id 'dummy'
    alias libs.plugins.quilt.loom
}

repositories {
    maven {
        name = 'gametest'
        url = '../core/build/gametestable'
    }
}

dependencies {
    minecraft(coreLibs.minecraft)

    final coreBuild = System.getenv().getOrDefault('BUILD_NUMBER', 'local')
    final coreVersion = "${coreLibs.versions.minecraft.get()}+build.${coreBuild}"
    mappings "org.quiltmc:gametestable-quilt-mappings:${coreVersion}:intermediary-v2"
}
