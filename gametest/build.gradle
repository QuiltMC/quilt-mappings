plugins {
    id 'java'
    id 'dummy'
    alias libs.plugins.quilt.loom
}

repositories {
    maven {
        name = 'gametestVerify'
        url = '../core/build/gametest-verify'
    }
}

dependencies {
    // implementation project(':core')

    minecraft(coreLibs.minecraft)
    // mappings('org.quiltmc:quilt-mappings')
    // mappings (variantOf(libs.gametest.verify.mappings)  { classifier 'intermediary-v2' })
    // final coreVersion = '1.21.5+build.local'
    final coreVersion = "${coreLibs.versions.minecraft.get()}+build.${System.getenv().getOrDefault('BUILD_NUMBER', 'local')}"

    mappings "org.quiltmc:gametest-verify:${coreVersion}:intermediary-v2"
}
