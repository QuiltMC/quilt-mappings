name: Publish
on: [push]
jobs:
  publish:
    if: ${{ github.repository_owner == 'QuiltMC' }}
    runs-on: ubuntu-latest
    container:
      image: eclipse-temurin:21
      options: --user root
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Configure git for container
        run: git config --global --add safe.directory "$(pwd)"

      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2

      # Ensure that releases are not ran in parallel, this ensures that the latest commit is the latest release
      # See https://github.com/softprops/turnstyle
      - name: Turnstyle
        uses: softprops/turnstyle@v1
        with:
          continue-after-seconds: 3600
          same-branch-only: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fetch tags because they're used to store build number.
      - name: Fetch tags
        run: git fetch --tags origin
      # Check for existing tag created by previous runs of "Increment build number".
      # Extract build number if present, otherwise start at 0.
      - name: Set build number
        shell: bash
        run: |
          output=$(git tag -l build/${{ github.ref }}-build-number-*)
          buildNumber=$(if [[ $output ]]; then echo $output | grep -oP "(?<=build-number-)[0-9]+$"; else echo 0; fi)
          echo "BUILD_NUMBER=$buildNumber" >> $GITHUB_ENV

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew
      # Publish before incrementing build number so it doesn't increase in the event of an error.
      - name: Publish
        run: ./gradlew build javadocJar publish --stacktrace
        env:
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SNAPSHOTS_URL: ${{ secrets.SNAPSHOTS_URL }}
          SNAPSHOTS_USERNAME: ${{ secrets.SNAPSHOTS_USERNAME }}
          SNAPSHOTS_PASSWORD: ${{ secrets.SNAPSHOTS_PASSWORD }}
          BRANCH_NAME: ${{ github.ref }}

      # Increment the build number based on tags to allow per branch build numbers, not something GitHub provides by default.
      - name: Increment build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.github_token }}
          prefix: "build/${{ github.ref }}"

      - name: Update Quilt Meta
        uses: quiltmc/update-quilt-meta@main
        with:
          b2-key-id: ${{ secrets.META_B2_KEY_ID }}
          b2-key: ${{ secrets.META_B2_KEY }}
          cf-key: ${{ secrets.META_CF_KEY }}
